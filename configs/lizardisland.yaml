method: closed_form   # "closed_form" or "newton"

camera:
  W: 593
  H: 518
  fx: 288.28  # 383.418 / 1.33
  fy: 287.51  # 382.382 / 1.33
  cx: 296.892
  cy: 260.068
  k1: 0
  k2: 0
  p1: 0
  p2: 0

housing:
  n_port: [0.0, 0.0, 1.0]
  mu_a: 1.0
  mu_g: 1.47
  mu_w: 1.33
  rflat: 0.02
  tglass: 0.002

paths:
  rgb_dir: "./input/rgb"
  output_dir: "./output/corrected"
  mask_dir: "./output/mask"
  depth_dir: null   # null = single fixed depth mode

correction:
  z0_fixed: 1.5
  step_size: 1
  crop_valid_bbox: true